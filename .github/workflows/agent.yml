name: growth-agent
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
  repository_dispatch:
    types: [approval]
concurrency: {group: agent, cancel-in-progress: false}
permissions: {contents: write, models: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python agent/main.py
        env:
          EVENT: ${{ github.event_name == 'repository_dispatch' && 'approval' || 'run' }}
          DECISION: ${{ github.event.client_payload.decision }}
          ITEM_ID: ${{ github.event.client_payload.item_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      - name: Save memory + heartbeat
        run: |
          date -u > memory/heartbeat.txt
          git config user.name "growth-agent"; git config user.email "agent@users.noreply.github.com"
          git add -A memory SOUL.md; git commit -m "memory update" || true
          git pull --rebase -q; git push
