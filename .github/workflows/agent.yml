name: growth-agent
on:
  schedule: [{cron: "17 */6 * * *"}]
  workflow_dispatch:
concurrency: {group: agent-state, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m agent.run
        env:
          LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      - name: Persist state
        if: always()
        run: bash scripts/commit_state.sh
      - name: Alert on failure
        if: failure()
        run: |
          curl -s -m 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" -d text="growth-agent run failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
