name: approvals-poller
on:
  schedule: [{cron: "*/10 * * * *"}]
  workflow_dispatch:
concurrency: {group: agent-state, cancel-in-progress: false}
permissions: {contents: write, models: read}
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - id: q
        run: echo "n=$(python3 -c 'import json;print(len(json.load(open("memory/pending.json"))))')" >> "$GITHUB_OUTPUT"
      - if: steps.q.outputs.n != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m agent.poll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      - name: Persist state
        if: always()
        run: bash scripts/commit_state.sh
