name: agent-session
# Long session: listens to Telegram in real time for ~4h50m, runs autonomous cycles, memory in Cloudflare R2.
# Manual start only until you decide to enable the schedule below.
on:
  workflow_dispatch:
  # schedule: [{cron: "7 0,5,10,15,20 * * *"}]
concurrency: {group: agent-state, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Require durable memory (R2)
        env:
          R2_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -z "$R2_KEY" ]; then echo "R2 secrets missing: refusing to run a long session without durable memory"; exit 1; fi
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m agent.session
        env:
          SESSION_MINUTES: "290"
          CYCLE_MINUTES: "180"
          LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
      - name: Backup state to git
        if: always()
        run: bash scripts/commit_state.sh
      - name: Alert on failure
        if: failure()
        run: |
          curl -s -m 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" -d text="agent-session failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
